version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: deepseekbot
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  # Upstream publishes only `latest` (main branch), `dev` and `sha-*` tags, so
  # track the latest digest and bump the patch version whenever it moves.
  - id: deepseekbot
    target: service
    service: deepseek-bot
    source: ghcr.io/fei2411/deepseek-bot
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: DeepSeek Bot
    summary: "运行在 DeepSeek Harness 上的长期在线 AI 机器人小队，支持 bot 间互发消息与群聊"